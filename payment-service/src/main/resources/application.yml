server:
  port: 8084

spring:
  application:
    name: payment-service
  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  order-service:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics