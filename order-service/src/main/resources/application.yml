server:
  port: 8083

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_service_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  user-service:
    url: http://localhost:8081
  product-service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics